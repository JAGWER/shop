<!DOCTYPE html><html lang="sw"><head><meta charset="utf-8"><title>G Victoria Shop</title>
<meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="style.css"></head><body>
<header><h1>🛍️ G Victoria Shop</h1></header><div id="app"><p class="pad mu">Inapakia…</p></div><div id="bar"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
let products=[],settings={},cart={},q='';const app=document.getElementById('app'),bar=document.getElementById('bar');
const money=n=>'TSh '+Number(n||0).toLocaleString('en-US');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
db.collection('products').onSnapshot(s=>{products=s.docs.map(d=>({id:d.id,...d.data()}));shop();},()=>{app.innerHTML='<p class="pad mu">Imeshindwa kupakia bidhaa.</p>'});
db.doc('settings/shop').onSnapshot(s=>{settings=s.data()||{};shop();});
function shop(){
  const list=products.filter(p=>p.available!==false&&(p.name||'').toLowerCase().includes(q.toLowerCase()));
  app.innerHTML=(settings.notice?`<div class="ban">📢 ${esc(settings.notice)}</div>`:'')+
  `<div class="pad"><input id="s" placeholder="Tafuta bidhaa…" value="${esc(q)}"></div><div class="grid">`+
  (list.map(p=>`<div class="card">${p.img?`<img src="${p.img}" alt="">`:'<div class="ph"></div>'}<div class="b"><div>${esc(p.name)}</div><div class="p">${money(p.price)}</div><button style="margin-top:8px;width:100%" onclick="add('${p.id}')">+ Weka</button></div></div>`).join('')||'<p class="mu">Hakuna bidhaa bado.</p>')+'</div>';
  const i=document.getElementById('s');i.oninput=e=>{q=e.target.value;shop();const n=document.getElementById('s');n.focus();n.setSelectionRange(q.length,q.length)};
  cbar();
}
function add(id){cart[id]=(cart[id]||0)+1;cbar();}
function ids(){return Object.keys(cart).filter(i=>products.find(p=>p.id==i))}
function cbar(){const a=ids(),n=a.reduce((x,i)=>x+cart[i],0);if(!n){bar.style.display='none';return}
  bar.style.display='block';bar.innerHTML=`<button style="width:100%" onclick="checkout()">🛒 Kikapu (${n}) · ${money(a.reduce((x,i)=>x+cart[i]*products.find(p=>p.id==i).price,0))}</button>`;}
function checkout(){
  bar.style.display='none';
  app.innerHTML='<div class="pad"><h2>Kikapu chako</h2>'+ids().map(i=>{const p=products.find(x=>x.id==i);return `<div class="it"><span>${esc(p.name)}<br><span class="mu">${money(p.price)}</span></span><span class="row"><button class="g" onclick="chg('${i}',-1)">−</button><b>${cart[i]}</b><button class="g" onclick="chg('${i}',1)">+</button></span></div>`}).join('')+
  `<br><input id="nm" placeholder="Jina lako"><input id="ad" placeholder="Mahali / anuani ya kupelekewa"><label class="mu">Njia ya malipo</label><select id="pay"><option value="cod">Lipa baada ya kupelekewa (Cash on delivery)</option><option value="airtel">Airtel Money (lipa sasa)</option></select><p class="mu">Airtel Money: ${AIRTEL} · Jina: ${AIRTEL_NAME}</p><button style="width:100%" onclick="send()">Tuma oda kwa WhatsApp</button><button class="g" style="width:100%;margin-top:8px" onclick="shop()">← Rudi dukani</button></div>`;
}
function chg(i,d){cart[i]+=d;if(cart[i]<=0)delete cart[i];ids().length?checkout():shop();}
function send(){
  let t=0;const lines=ids().map(i=>{const p=products.find(x=>x.id==i);t+=p.price*cart[i];return `• ${p.name} x${cart[i]} = ${money(p.price*cart[i])}`});
  const pay=document.getElementById('pay').value=='cod'?'Nitalipa baada ya kupelekewa (Cash on delivery)':`Nitalipa Airtel Money ${AIRTEL} (${AIRTEL_NAME})`;
  const msg=`Habari G Victoria Shop, nataka kuagiza:\n${lines.join('\n')}\nJumla: ${money(t)}\nJina: ${document.getElementById('nm').value}\nMahali: ${document.getElementById('ad').value}\nMalipo: ${pay}`;
  let ph=(settings.whatsapp||DEFAULT_WHATSAPP).replace(/\D/g,'');if(ph[0]=='0')ph='255'+ph.slice(1);
  window.open('https://wa.me/'+ph+'?text='+encodeURIComponent(msg),'_blank');
}
</script></body></html>
